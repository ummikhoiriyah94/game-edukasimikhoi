<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labirin Quest: Teknik Pengambilan Gambar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        canvas { background-color: #1e293b; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); border-radius: 0.5rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="text-center mb-2">
        <h1 class="text-2xl font-bold text-amber-400">Labirin Quest: Sudut Pandang & Bidang Latar</h1>
        <p class="text-xs text-slate-400">Gunakan Tombol Panah (Arrow Keys) untuk bergerak menuju zona jawaban yang benar sebelum monster menangkapmu!</p>
    </header>

    <!-- Info Game -->
    <div class="w-full max-w-2xl flex justify-between items-center bg-slate-800 px-4 py-2 rounded-lg mb-3 border border-slate-700 text-sm">
        <div>Soal ke: <span id="txtSoal" class="font-bold text-amber-300">1</span> / 25</div>
        <div>Skor: <span id="txtSkor" class="font-bold text-emerald-400">0</span></div>
        <button onclick="toggleBGM()" id="btnBGM" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-xs transition">🎵 Musik: Mati</button>
    </div>

    <!-- Area Pertanyaan -->
    <div class="w-full max-w-2xl bg-slate-800 p-4 rounded-lg mb-3 border border-slate-700 shadow-inner">
        <h2 id="txtPertanyaan" class="text-sm md:text-base font-semibold text-slate-100 text-center">Memuat pertanyaan...</h2>
    </div>

    <!-- Canvas Game Labirin -->
    <div class="relative flex justify-center">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <!-- Kontrol Tambahan / Petunjuk -->
    <footer class="mt-3 text-center text-xs text-slate-500">
        Navigasi: ⬆️ ⬇️ ⬅️ ➡️ (Panah Keyboard) &bull; Hindari Monster Merah!
    </footer>

    <!-- Script Logika Game -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Bank 25 Soal Lengkap
        const bankSoal = [
            { t: "Sudut pengambilan gambar sejajar dengan mata subjek disebut...", o: ["Eye Level / Normal Angle", "High Angle", "Low Angle", "Bird Eye View"], b: 0 },
            { t: "Teknik pengambilan gambar dari atas objek sehingga objek terlihat kecil disebut...", o: ["Low Angle", "High Angle", "Frog Eye", "Eye Level"], b: 1 },
            { t: "Pengambilan gambar dari bawah objek sehingga objek tampak megah/berwibawa adalah...", o: ["High Angle", "Bird Eye View", "Low Angle", "Eye Level"], b: 2 },
            { t: "Bidang latar yang menampilkan seluruh tubuh manusia dari ujung kepala sampai kaki dinamakan...", o: ["Close Up", "Medium Shot", "Full Shot", "Extreme Long Shot"], b: 2 },
            { t: "Ukuran bidang pandang yang menampilkan subjek dari dada hingga ke atas disebut...", o: ["Medium Close Up (MCU)", "Big Close Up (BCU)", "Extreme Close Up", "Long Shot"], b: 0 },
            { t: "Pengambilan gambar sangat dekat, hanya berfokus pada detail bagian tubuh tertentu (misal mata/bibir) adalah...", o: ["Medium Shot", "Extreme Close Up (ECU)", "Full Shot", "Medium Long Shot"], b: 1 },
            { t: "Sudut pengambilan gambar dari ketinggian ekstrem (seperti pandangan burung) disebut...", o: ["High Angle", "Bird Eye View / Aerial Shot", "Low Angle", "Eye Level"], b: 1 },
            { t: "Posisi kamera sejajar dengan tanah atau sangat rendah melihat ke atas dinamakan sudut...", o: ["Frog Eye View", "Eye Level", "Normal Angle", "High Angle"], b: 0 },
            { t: "Bidang latar yang memperlihatkan subjek secara utuh di tengah lingkungan yang sangat luas adalah...", o: ["Extreme Long Shot (ELS)", "Medium Shot", "Close Up", "Medium Close Up"], b: 0 },
            { t: "Ukuran framing yang menampilkan separuh badan subjek (biasanya dari pinggang ke atas) adalah...", o: ["Medium Shot (MS)", "Full Shot", "Close Up", "Extreme Close Up"], b: 0 },
            { t: "Sudut kamera yang dimiringkan secara sengaja untuk memberikan kesan tidak stabil disebut...", o: ["Dutch Angle / Canted Angle", "Normal Angle", "Bird Eye", "Low Angle"], b: 0 },
            { t: "Bidang latar yang menunjukkan subjek dari lutut sampai ke atas kepala dinamakan...", o: ["Medium Long Shot (MLS) / Cowboy Shot", "Full Shot", "Close Up", "Medium Shot"], b: 0 },
            { t: "Manakah bidang latar yang paling tepat digunakan untuk menunjukkan ekspresi emosional mendalam?", o: ["Extreme Long Shot", "Close Up (CU)", "Full Shot", "Medium Long Shot"], b: 1 },
            { t: "Jika sutradara ingin menunjukkan interaksi dua orang pemain secara jelas dalam satu frame, ukuran yang pas adalah...", o: ["Medium Shot / Two Shot", "Extreme Close Up", "Bird Eye View", "Frog Eye View"], b: 0 },
            { t: "Tujuan utama penggunaan Low Angle pada karakter dalam film adalah...", o: ["Membuat karakter tampak lemah", "Membuat karakter tampak berkuasa, kuat, atau mengintimidasi", "Menunjukkan latar tempat", "Membuat gambar lebih gelap"], b: 1 },
            { t: "Tujuan penggunaan High Angle dalam sebuah adegan biasanya untuk mengesankan bahwa subjek sedang...", o: ["Kuat dan dominan", "Lemah, tertekan, kecil, atau rapuh", "Berada di tempat yang sangat luas", "Marah besar"], b: 1 },
            { t: "Istilah 'Cowboy Shot' merujuk pada ukuran bidang latar...", o: ["Medium Long Shot (sebatas lutut/pistol koboi)", "Extreme Close Up", "Bird Eye View", "Eye Level"], b: 0 },
            { t: "Apa fungsi dari Extreme Long Shot (ELS) di awal sebuah scene film?", o: ["Menunjukkan detail wajah", "Establishing shot (memperkenalkan lokasi/setting tempat)", "Menakut-nakuti penonton", "Fokus pada dialog rahasia"], b: 1 },
            { t: "Kamera diletakkan tepat di atas kepala subjek secara tegak lurus mengarah ke bawah disebut...", o: ["Top Angle / Bird Eye View", "Frog Eye", "Low Angle", "Eye Level"], b: 0 },
            { t: "Bidang latar yang memperlihatkan area sekitar subjek sedikit lebih dominan dibanding subjeknya sendiri adalah...", o: ["Long Shot (LS)", "Close Up", "Big Close Up", "Extreme Close Up"], b: 0 },
            { t: "Manakah sudut pandang yang memberikan kesan netral tanpa memihak emosi tertentu?", o: ["Eye Level", "Low Angle", "Dutch Angle", "Frog Eye"], b: 0 },
            { t: "Bagian tubuh mana yang biasanya dibatasi oleh bingkai pada ukuran Medium Close Up (MCU)?", o: ["Dari dada/bahu hingga kepala", "Dari lutut ke kepala", "Hanya bola mata", "Seluruh tubuh"], b: 0 },
            { t: "Teknik framing yang memotong bagian atas dahi dan dagu subjek secara sangat ketat masuk kategori...", o: ["Big Close Up (BCU)", "Medium Shot", "Full Shot", "Long Shot"], b: 0 },
            { t: "Dalam teknik pergerakan dan sudut kamera, pengambilan gambar dari sudut pandang tokoh lain disebut...", o: ["Subjective / Point of View (POV) Shot", "Objective Shot", "Master Shot", "Neutral Shot"], b: 0 },
            { t: "Apa dampak visual dari penggunaan bidang latar Close Up secara terus-menerus?", o: ["Penonton merasa sangat dekat secara intim dengan emosi karakter", "Penonton mengetahui seluruh peta lokasi", "Suasana terasa sangat jauh", "Menampilkan panorama luas"], b: 0 }
        ];

        let indexSoal = 0;
        let skor = 0;
        let gameActive = true;

        // Player & Monster
        let player = { x: 50, y: 200, size: 16, speed: 3 };
        let monster = { x: 520, y: 200, size: 18, speed: 1.2 };

        // Opsi Jawaban dalam bentuk Zona di Labirin
        let zones = [];
        let salahDipilih = []; // Menyimpan indeks zona yang sudah salah dipilih

        // Kontrol Tombol Keyboard
        let keys = {};
        window.addEventListener('keydown', e => { keys[e.key] = true; });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        function setupSoal() {
            if (indexSoal >= bankSoal.length) {
                gameActive = false;
                tampilkanMenang();
                return;
            }

            let soal = bankSoal[indexSoal];
            document.getElementById('txtSoal').innerText = indexSoal + 1;
            document.getElementById('txtSkor').innerText = skor;
            document.getElementById('txtPertanyaan').innerText = soal.t;

            player.x = 50;
            player.y = 200;
            monster.x = 520;
            monster.y = 200;
            salahDipilih = [];

            // Buat 4 zona sudut/area di labirin untuk 4 opsi
            // Format zona: { id, x, y, w, h, text, isCorrect }
            let positions = [
                { x: 450, y: 50, w: 120, h: 60 },   // Atas Kanan
                { x: 450, y: 290, w: 120, h: 60 },  // Bawah Kanan
                { x: 80, y: 50, w: 120, h: 60 },    // Atas Kiri
                { x: 80, y: 290, w: 120, h: 60 }    // Bawah Kiri
            ];

            // Acak penempatan opsi ke posisi zona
            let indices = [0, 1, 2, 3];
            zones = indices.map((optIdx, i) => {
                return {
                    id: optIdx,
                    x: positions[i].x,
                    y: positions[i].y,
                    w: positions[i].w,
                    h: positions[i].h,
                    text: `${String.fromCharCode(65 + optIdx)}. ${soal.o[optIdx]}`,
                    isCorrect: (optIdx === soal.b)
                };
            });
        }

        // Web Audio Sintesis untuk Efek & Musik
        let audioCtx = null;
        let bgmInterval = null;
        let isBgmOn = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'bomb') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'gameover') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.6);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        function toggleBGM() {
            initAudio();
            isBgmOn = !isBgmOn;
            let btn = document.getElementById('btnBGM');
            if (isBgmOn) {
                btn.innerText = "🎵 Musik: Nyala";
                btn.className = "bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded text-xs transition";
                startBGM();
            } else {
                btn.innerText = "🎵 Musik: Mati";
                btn.className = "bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-xs transition";
                stopBGM();
            }
        }

        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            let notes = [261.63, 329.63, 392.00, 523.25]; // Akor C major santai
            let step = 0;
            bgmInterval = setInterval(() => {
                if (!isBgmOn || !audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
                step++;
            }, 600);
        }

        function stopBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
        }

        // Efek Visual (Kembang Api / Bom)
        let visualEffect = null; // { type: 'firework'/'bomb', timer: 0, x: 0, y: 0 }

        function update() {
            if (!gameActive) return;

            // Pergerakan Player
            if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
            if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

            // Batas Arena Canvas
            player.x = Math.max(15, Math.min(canvas.width - 15, player.x));
            player.y = Math.max(15, Math.min(canvas.height - 15, player.y));

            // Pergerakan Monster Random mendekati Player perlahan
            let angle = Math.atan2(player.y - monster.y, player.x - monster.x);
            // Tambahkan sedikit elemen acak agar gerakannya seperti labirin/acak
            monster.x += Math.cos(angle + (Math.random() - 0.5)) * monster.speed;
            monster.y += Math.sin(angle + (Math.random() - 0.5)) * monster.speed;

            // Deteksi Tabrakan Monster dengan Player
            let dist = Math.hypot(player.x - monster.x, player.y - monster.y);
            if (dist < player.size + monster.size) {
                playSound('gameover');
                gameActive = false;
                alert("Game Over! Kamu tertangkap monster.");
                location.reload();
            }

            // Cek Tabrakan dengan Zona Jawaban
            zones.forEach(zone => {
                // Jika sudah ditandai salah, lewati
                if (salahDipilih.includes(zone.id)) return;

                // Cek apakah player berada di dalam area zona
                if (player.x > zone.x && player.x < zone.x + zone.w &&
                    player.y > zone.y && player.y < zone.y + zone.h) {
                    
                    initAudio();
                    if (zone.isCorrect) {
                        // Jawaban Benar
                        playSound('success');
                        skor += 10;
                        visualEffect = { type: 'firework', x: zone.x + zone.w/2, y: zone.y + zone.h/2, timer: 40 };
                        gameActive = false;
                        setTimeout(() => {
                            indexSoal++;
                            gameActive = true;
                            setupSoal();
                        }, 1200);
                    } else {
                        // Jawaban Salah
                        playSound('bomb');
                        salahDipilih.push(zone.id);
                        visualEffect = { type: 'bomb', x: zone.x + zone.w/2, y: zone.y + zone.h/2, timer: 30 };
                        // Dorong player sedikit mundur agar tidak terus menerus mentrigger
                        player.x -= 30;
                    }
                }
            });

            if (visualEffect && visualEffect.timer > 0) {
                visualEffect.timer--;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gambar Dinding Labirin (Garis-garis dekoratif labirin)
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

            // Gambar Zona Jawaban
            zones.forEach(zone => {
                let isSalah = salahDipilih.includes(zone.id);
                
                if (isSalah) {
                    ctx.fillStyle = "#7f1d1d"; // Merah gelap karena salah
                    ctx.strokeStyle = "#dc2626";
                } else {
                    ctx.fillStyle = "#1e3a8a"; // Biru labirin opsi
                    ctx.strokeStyle = "#3b82f6";
                }

                ctx.fillRect(zone.x, zone.y, zone.w, zone.h);
                ctx.strokeRect(zone.x, zone.y, zone.w, zone.h);

                // Teks Opsi di dalam Kotak
                ctx.fillStyle = isSalah ? "#fca5a5" : "#e2e8f0";
                ctx.font = "11px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                // Wrap text sederhana dalam kotak
                let words = zone.text.split(' ');
                let line = '';
                let lineY = zone.y + 20;
                let maxW = zone.w - 10;

                for (let n = 0; n < words.length; n++) {
                    let testLine = line + words[n] + ' ';
                    let metrics = ctx.measureText(testLine);
                    if (metrics.width > maxW && n > 0) {
                        ctx.fillText(line, zone.x + zone.w / 2, lineY);
                        line = words[n] + ' ';
                        lineY += 15;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, zone.x + zone.w / 2, lineY);

                // Jika sudah salah, beri tanda X besar
                if (isSalah) {
                    ctx.fillStyle = "#ef4444";
                    ctx.font = "bold 24px sans-serif";
                    ctx.fillText("❌", zone.x + zone.w / 2, zone.y + zone.h / 2);
                }
            });

            // Gambar Player (Lingkaran Hijau)
            ctx.fillStyle = "#10b981";
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#047857";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Gambar Monster (Lingkaran Merah)
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(monster.x, monster.y, monster.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#991b1b";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Gambar Efek Visual (Kembang Api / Bom)
            if (visualEffect && visualEffect.timer > 0) {
                ctx.save();
                if (visualEffect.type === 'firework') {
                    ctx.fillStyle = "#fbbf24";
                    ctx.font = "bold 24px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("✨ BENAR! ✨", visualEffect.x, visualEffect.y - (40 - visualEffect.timer));
                } else if (visualEffect.type === 'bomb') {
                    ctx.fillStyle = "#f87171";
                    ctx.font = "bold 24px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("💥 SALAH! 💥", visualEffect.x, visualEffect.y);
                }
                ctx.restore();
            }
        }

        function tampilkanMenang() {
            ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#facc15";
            ctx.font = "bold 22px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🎉 SELAMAT! KAMU MENANG! 🎉", canvas.width / 2, canvas.height / 2 - 20);

            ctx.fillStyle = "#f8fafc";
            ctx.font = "14px sans-serif";
            ctx.fillText(`Skor Akhir Kamu: ${skor}`, canvas.width / 2, canvas.height / 2 + 20);
            ctx.fillText("Tekan F5 untuk bermain lagi.", canvas.width / 2, canvas.height / 2 + 50);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Inisialisasi Pertama
        setupSoal();
        loop();
    </script>
</body>
</html>
